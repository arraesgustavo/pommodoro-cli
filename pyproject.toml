[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pommo"
version = "0.1.0"
description = "Cyberpunk Pomodoro CLI para o terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # TUI será adicionada na próxima etapa
]

[project.scripts]
pommo = "pommo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pommo*"]
